<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | SMP Portal</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css"></head><body><div class="auth"><section class="auth-art"><div class="logo">SMP</div><h1>Join the SMP<br>digital campus.</h1><p>Create a real portal account. Your account is stored in the school's SQL database and a secure session is created after registration.</p></section><section class="auth-panel"><div class="auth-card"><a href="login.html" class="muted">← Back to login</a><h2>Create account</h2><p class="muted">Choose your account type.</p><div class="tabs"><button type="button" class="role active" data-role="student">Student</button><button type="button" class="role" data-role="teacher">Teacher</button></div><form id="regForm"><input id="fullName" required placeholder="Full name" autocomplete="name"><input id="email" type="email" required placeholder="Email address" autocomplete="email"><input id="schoolId" required placeholder="Student ID" autocomplete="username"><div id="studentFields"><select id="classField"><option value="8-B">Grade 8 - B</option><option value="6-A">Grade 6 - A</option><option value="7-A">Grade 7 - A</option><option value="9-A">Grade 9 - A</option><option value="10-B">Grade 10 - B</option></select><input id="roll" type="number" min="1" placeholder="Roll number"></div><select id="subject" style="display:none"><option>English</option><option>Mathematics</option><option>Science</option><option>ICT</option></select><input id="phone" placeholder="Phone number"><input id="password" required minlength="4" type="password" placeholder="Create password" autocomplete="new-password"><button id="regBtn" class="btn primary" type="submit">Create Account</button></form><p id="regMsg" class="center muted" style="min-height:22px"></p></div></section></div><script>
let role='student';const $=id=>document.getElementById(id);
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{document.querySelectorAll('.role').forEach(x=>x.classList.remove('active'));b.classList.add('active');role=b.dataset.role;const student=role==='student';$('studentFields').style.display=student?'block':'none';$('subject').style.display=student?'none':'block';$('schoolId').placeholder=student?'Student ID':'Teacher ID';});
$('regForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('regBtn'),msg=$('regMsg');btn.disabled=true;btn.textContent='Creating…';msg.textContent='';try{const [grade,section]=($('classField').value||'8-B').split('-');const r=await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({role,name:$('fullName').value.trim(),email:$('email').value.trim(),loginId:$('schoolId').value.trim(),password:$('password').value,phone:$('phone').value.trim(),grade,section,roll:Number($('roll').value)||0,subject:$('subject').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Registration failed');localStorage.setItem('smpUserId',d.user.id);localStorage.setItem('smpRole',d.user.role);localStorage.setItem('smpName',d.user.name);location.replace(d.user.role==='student'?'student-dashboard.html':'teacher-dashboard.html');}catch(err){const offline=err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(err.message||'');msg.textContent=offline?'Server connection failed. Start the SMP server and open http://localhost:3000.':err.message;msg.style.color='#c0392b';$('serverHint').textContent=offline?'Expected: npm install → npm start → http://localhost:3000':'';}finally{btn.disabled=false;btn.textContent='Create Account';}});
</script></body></html>
